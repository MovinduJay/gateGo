services:
  backend-a:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      BACKEND_NAME: backend-a
      PORT: "9001"
    ports:
      - "9001:9001"

  backend-b:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      BACKEND_NAME: backend-b
      PORT: "9002"
    ports:
      - "9002:9002"

  backend-c:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      BACKEND_NAME: backend-c
      PORT: "9003"
    ports:
      - "9003:9003"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  gatego-1:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - backend-a
      - backend-b
      - backend-c
      - redis
    environment:
      GATEGO_JWT_SECRET: dev-only-change-me
      GATEGO_ADMIN_KEY: dev-admin-key
      GATEGO_REDIS_ADDR: redis:6379
    volumes:
      - ./configs/gatego.json:/configs/gatego.json:ro
    ports:
      - "8080:8080"

  gatego-2:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - backend-a
      - backend-b
      - backend-c
      - redis
    environment:
      GATEGO_JWT_SECRET: dev-only-change-me
      GATEGO_ADMIN_KEY: dev-admin-key
      GATEGO_REDIS_ADDR: redis:6379
    volumes:
      - ./configs/gatego.json:/configs/gatego.json:ro
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    depends_on: [gatego-1, gatego-2]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
