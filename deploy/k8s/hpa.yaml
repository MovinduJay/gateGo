apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gatego
  namespace: gatego
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gatego
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
