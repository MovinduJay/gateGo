name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Unit and component tests
        run: go test -race ./internal/... -count=1
      - name: HTTP integration tests
        run: go test -race ./integration -count=1
      - run: go vet ./...
      - run: go build ./cmd/gatego ./cmd/demo-backend ./cmd/token ./cmd/loadgen

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: gatego:test
