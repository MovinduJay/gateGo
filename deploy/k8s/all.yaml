apiVersion: v1
kind: Namespace
metadata:
  name: gatego
---
apiVersion: v1
kind: Secret
metadata:
  name: gatego-secrets
  namespace: gatego
type: Opaque
stringData:
  jwt-secret: change-me-in-production
  admin-key: change-me-admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatego-config
  namespace: gatego
data:
  gatego.json: |
    {
      "server":{"listen":":8080","read_header_timeout":"5s","idle_timeout":"60s","shutdown_timeout":"10s","max_request_body_bytes":2097152},
      "health":{"interval":"3s","timeout":"1s","failure_threshold":2,"success_threshold":1},
      "observability":{"service_name":"gatego"},
      "routes":[
        {"name":"public-api","path_prefix":"/public","methods":["GET","POST"],"auth_required":false,"rate_limit":{"requests_per_second":25,"burst":50},"timeout":"2s","retries":2,"backends":[{"url":"http://backend-a:9001","weight":3,"health_path":"/healthz"},{"url":"http://backend-b:9002","weight":1,"health_path":"/healthz"}]},
        {"name":"protected-api","path_prefix":"/api","methods":["GET","POST","PUT","PATCH","DELETE"],"auth_required":true,"rate_limit":{"requests_per_second":50,"burst":100},"timeout":"3s","retries":2,"backends":[{"url":"http://backend-a:9001","weight":2,"health_path":"/healthz"},{"url":"http://backend-b:9002","weight":1,"health_path":"/healthz"},{"url":"http://backend-c:9003","weight":1,"health_path":"/healthz"}]}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: gatego
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: gatego
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-a
  namespace: gatego
spec:
  replicas: 1
  selector: {matchLabels: {app: backend-a}}
  template:
    metadata: {labels: {app: backend-a}}
    spec:
      containers:
        - name: backend
          image: ghcr.io/YOUR_GITHUB/gatego-demo:latest
          env:
            - {name: BACKEND_NAME, value: backend-a}
            - {name: PORT, value: "9001"}
          ports: [{containerPort: 9001}]
          readinessProbe: {httpGet: {path: /healthz, port: 9001}, initialDelaySeconds: 2, periodSeconds: 5}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-a
  namespace: gatego
spec:
  selector: {app: backend-a}
  ports: [{port: 9001, targetPort: 9001}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-b
  namespace: gatego
spec:
  replicas: 1
  selector: {matchLabels: {app: backend-b}}
  template:
    metadata: {labels: {app: backend-b}}
    spec:
      containers:
        - name: backend
          image: ghcr.io/YOUR_GITHUB/gatego-demo:latest
          env:
            - {name: BACKEND_NAME, value: backend-b}
            - {name: PORT, value: "9002"}
          ports: [{containerPort: 9002}]
          readinessProbe: {httpGet: {path: /healthz, port: 9002}, initialDelaySeconds: 2, periodSeconds: 5}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-b
  namespace: gatego
spec:
  selector: {app: backend-b}
  ports: [{port: 9002, targetPort: 9002}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-c
  namespace: gatego
spec:
  replicas: 1
  selector: {matchLabels: {app: backend-c}}
  template:
    metadata: {labels: {app: backend-c}}
    spec:
      containers:
        - name: backend
          image: ghcr.io/YOUR_GITHUB/gatego-demo:latest
          env:
            - {name: BACKEND_NAME, value: backend-c}
            - {name: PORT, value: "9003"}
          ports: [{containerPort: 9003}]
          readinessProbe: {httpGet: {path: /healthz, port: 9003}, initialDelaySeconds: 2, periodSeconds: 5}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-c
  namespace: gatego
spec:
  selector: {app: backend-c}
  ports: [{port: 9003, targetPort: 9003}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatego
  namespace: gatego
spec:
  replicas: 2
  selector: {matchLabels: {app: gatego}}
  template:
    metadata: {labels: {app: gatego}}
    spec:
      containers:
        - name: gatego
          image: ghcr.io/YOUR_GITHUB/gatego:latest
          args: ["-config", "/configs/gatego.json"]
          env:
            - name: GATEGO_JWT_SECRET
              valueFrom: {secretKeyRef: {name: gatego-secrets, key: jwt-secret}}
            - name: GATEGO_ADMIN_KEY
              valueFrom: {secretKeyRef: {name: gatego-secrets, key: admin-key}}
            - {name: GATEGO_REDIS_ADDR, value: "redis:6379"}
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: config, mountPath: /configs, readOnly: true}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 3, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: config
          configMap: {name: gatego-config}
---
apiVersion: v1
kind: Service
metadata:
  name: gatego
  namespace: gatego
spec:
  type: LoadBalancer
  selector: {app: gatego}
  ports: [{port: 80, targetPort: 8080}]
